version: '3.8'

services:
  # Node.js Backend
  backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    depends_on:
      - firebase
      - redis
    volumes:
      - .:/app
    networks:
      - vendabot

  # Redis para cache e filas
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - vendabot

  # Firebase Emulator
  firebase:
    image: mtlynch/firebase-emulator
    ports:
      - "4000:4000"
    networks:
      - vendabot

networks:
  vendabot:
    driver: bridge
